---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    {% if page.date %}
      {% if page.lang == 'fa' %}تاریخ انتشار: {% else %}Published: {% endif %}{{ page.date | date: "%Y-%m-%d" }}
    {% endif %}
  </div>

  {{ content }}

  {% include comments.html %}
</article>
